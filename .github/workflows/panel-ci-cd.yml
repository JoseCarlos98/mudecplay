name: MUDECPLAY Panel CI/CD

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    name: Build Angular
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build:prod

      - name: Configure AWS credentials with OIDC
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::806364132626:role/mudecplay-github-actions-panel-role
          aws-region: us-east-2

      - name: Verify AWS identity
        if: github.ref == 'refs/heads/main'
        run: aws sts get-caller-identity

      - name: Validate production build
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if [ ! -f "dist/mudecplay/browser/index.html" ]; then
            echo "Production build was not found."
            exit 1
          fi

          echo "Production build validated."

      - name: Deploy to S3
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          aws s3 sync \
            dist/mudecplay/browser \
            s3://mudecplay-admin-prod \
            --delete

      - name: Invalidate CloudFront
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id E1WXTKUNKBLGKM \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)

          if [ -z "$INVALIDATION_ID" ] || [ "$INVALIDATION_ID" = "None" ]; then
            echo "Could not create CloudFront invalidation."
            exit 1
          fi

          echo "Invalidation created: $INVALIDATION_ID"

          aws cloudfront wait invalidation-completed \
            --distribution-id E1WXTKUNKBLGKM \
            --id "$INVALIDATION_ID"

          echo "CloudFront invalidation completed."
