<div class="login-page">
    <div class="login-card">
        <div class="login-card__brand">
            <div class="brand-logo">
                <span class="brand-logo__icon">M</span>
            </div>
            <div class="brand-text">
                <h1 class="brand-title">MUDECPLAY</h1>
                <p class="brand-subtitle">Panel administrativo</p>
            </div>
        </div>

        <h2 class="login-title">Iniciar sesión</h2>
        <p class="login-subtitle">
            Ingresa tus credenciales para acceder al panel.
        </p>

        @if (loginError) { 
            <div class="alert">{{ loginError }}</div>
        }

        <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="login-form">
            <!-- Email -->
            <div class="form-group" [class.has-error]="showFieldError('email')">
                <label for="email">Correo electrónico</label>
                <input id="email" type="email" formControlName="email" placeholder="tucorreo@ejemplo.com" />
                <small class="error" [class.error--visible]="showFieldError('email')">
                    Ingresa un correo válido.
                </small>
            </div>

            <!-- Password -->
            <div class="form-group password-group" [class.has-error]="showFieldError('password')">
                <label for="password">Contraseña</label>

                <div class="password-wrapper">
                    <input id="password" [type]="showPassword ? 'text' : 'password'" formControlName="password"
                        placeholder="•••••••" />
                    <button type="button" class="toggle-password" mat-icon-button (click)="showPassword = !showPassword"
                        [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
                        <mat-icon class="toggle-password__icon">
                            {{ showPassword ? 'visibility_off' : 'visibility' }}
                        </mat-icon>
                    </button>
                </div>

                <small class="error" [class.error--visible]="showFieldError('password')">
                    La contraseña debe tener al menos 5 caracteres.
                </small>
            </div>

            <!-- Meta (recuperar contraseña) -->
            <!-- <div class="form-meta">
                <button type="button" class="link-button">
                    ¿Olvidaste tu contraseña?
                </button>
            </div> -->

            <!-- Botón -->
            <div class="form-footer">
                <button type="submit" [disabled]="form.invalid || isSubmitting()">
                    @if (!isSubmitting()) {
                        <span>Entrar</span>
                    } @else {
                        <span>Entrando...</span>
                    }
                </button>
            </div>
        </form>

        <p class="login-footnote">
            © 2026 MUDECPLAY · Todos los derechos reservados
        </p>
    </div>

    <!-- Columna derecha: hero -->
    <div class="login-hero">
        <div class="login-hero__overlay"></div>

        <div class="login-hero__content">
            <h2>Bienvenido a MUDECPLAY</h2>
            <!-- <p>
                Gestiona tu contenido multimedia, campañas y material de forma
                centralizada.
            </p> -->

            <!-- <div class="hero-tags">
                <span class="hero-tag">Fotos & videos</span>
                <span class="hero-tag">Descargables</span>
                <span class="hero-tag">Diseños temáticos</span>
                <span class="hero-tag">Campañas</span>
            </div> -->
        </div>
    </div>
</div>
