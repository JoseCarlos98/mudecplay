<div class="unauth-page">
  <div class="unauth-card card-content">
    <div class="unauth-icon">
      <mat-icon>lock</mat-icon>
    </div>

    <h2 class="unauth-title color-secundary">Sin permisos</h2>

    <p class="unauth-subtitle color-third">
      No tienes permisos para acceder a esta sección. Si crees que es un error,
      solicita acceso al administrador.
    </p>

    <div class="unauth-actions">
      <a class="btn btn-outline" routerLink="/gastos">
        <mat-icon>arrow_back</mat-icon>
        Volver
      </a>

      <a class="btn btn-primary" routerLink="/">
        <mat-icon>home</mat-icon>
        Ir al inicio
      </a>
    </div>

    <div class="unauth-tip">
      <span class="tip-pill">
        <mat-icon>info</mat-icon>
        Tu sesión está activa, solo faltan permisos.
      </span>
    </div>
  </div>
</div>
