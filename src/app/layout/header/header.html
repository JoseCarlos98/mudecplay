<header class="header">
  @if (isMobile) {
    <button
      type="button"
      mat-icon-button
      class="header-menu-btn"
      [attr.aria-label]="sidebarOpen ? 'Cerrar menú' : 'Abrir menú'"
      (click)="toggleSidebar.emit()">
      <mat-icon>{{ sidebarOpen ? 'close' : 'menu' }}</mat-icon>
    </button>

    <div class="header-brand" aria-label="MUDECPLAY Panel">
      <span class="header-brand__title">MUDECPLAY</span>
    </div>
  }

  <div class="header-user">
    @if (isUserMenuOpen) {
      <button
        type="button"
        class="header-user-backdrop"
        aria-label="Cerrar menú de usuario"
        (click)="closeUserMenu()">
      </button>
    }

    <button
      type="button"
      class="header-user-trigger"
      [class.header-user-trigger--open]="isUserMenuOpen"
      [attr.aria-expanded]="isUserMenuOpen"
      aria-haspopup="menu"
      (click)="toggleUserMenu()">
      <span class="header-user-trigger__text">
        Hola, {{ userShortName }}
      </span>

      <mat-icon class="header-user-trigger__icon">
        {{ isUserMenuOpen ? 'expand_less' : 'expand_more' }}
      </mat-icon>
    </button>

    @if (isUserMenuOpen) {
      <section class="header-user-menu" role="menu">
        <div class="header-user-menu__top">
          <div class="header-user-menu__initials">
            {{ userInitials }}
          </div>

          <div class="header-user-menu__identity">
            <h3>{{ userName }}</h3>
            <p>{{ userEmail }}</p>
          </div>
        </div>

        <div class="header-user-menu__roles">
          <span class="header-user-menu__label">Roles</span>

          @if (userRoleLabels.length > 0) {
            <div class="header-user-menu__role-list">
              @for (role of userRoleLabels; track role) {
                <span class="header-user-menu__role-chip">
                  {{ role }}
                </span>
              }
            </div>
          } @else {
            <span class="header-user-menu__empty">
              Sin roles asignados
            </span>
          }
        </div>
      </section>
    }
  </div>
</header>
