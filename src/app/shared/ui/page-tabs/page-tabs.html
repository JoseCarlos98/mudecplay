<div class="home-page card-content">
  <header class="home-header">
    <div>
      <h1>{{ title }}</h1>

      @if (description) {
        <p> {{ description }} </p>
      }
    </div>
  </header>

  <!-- Tabs -->
  <nav class="home-tabs">
    @for (tab of tabs; track tab.id) {
      <button
        type="button"
        class="home-tab"
        [class.home-tab--active]="activeTab === tab.id"
        (click)="onTabClick(tab.id)"
      >
        <mat-icon class="home-tab__icon">
          {{ tab.icon }}
        </mat-icon>

        <span class="home-tab__text">
          <strong>{{ tab.label }}</strong>

          @if (tab.description) {
            <small>
              {{ tab.description }}
            </small>
          }
        </span>
      </button>
    }
  </nav>

  <!-- Contenido -->
  <section class="home-content" [class.home-content--hidden]="contentState() === 'hidden'" >
    <ng-content></ng-content>
  </section>
</div>
