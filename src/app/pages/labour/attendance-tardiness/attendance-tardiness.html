<div class="c-table-page">
  <div class="card-content shadow-md">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
      <div class="flex-1 min-w-0">
        <app-module-header
          title="Llegadas y retardos"
          [config]="headerConfig"
          (action)="onHeaderAction($event)">
        </app-module-header>
      </div>

      <button
        type="button"
        class="btn-primary whitespace-nowrap"
        (click)="goToClockImport()">
        <mat-icon>upload_file</mat-icon>
        <span>Importar reloj checador</span>
      </button>
    </div>

    <form [formGroup]="formFilters">
      <div class="c-filters grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-5">
        <app-input-date
          formControlName="workDate"
          label="Fecha de asistencia"
          mode="single"
          [showClear]="false">
        </app-input-date>

        <app-input-field
          formControlName="employeeName"
          label="Empleado"
          type="text"
          [isFilter]="true">
        </app-input-field>

        <app-input-select
          formControlName="employeeAreaId"
          label="Área"
          [options]="areaOptions">
        </app-input-select>

        <app-input-select
          formControlName="status"
          label="Estatus llegada"
          [options]="statusOptions">
        </app-input-select>

        <app-btns-section
          type="search"
          [hasActiveFilters]="hasActiveFilters"
          (action)="onBtnsSectionAction($event)">
        </app-btns-section>
      </div>
    </form>
  </div>

  @if (attendanceTableData?.data) {
    <div class="c-module-table">
      <app-data-table
        [data]="attendanceTableData.data"
        [columnsConfig]="columnsConfig"
        [displayedColumns]="displayedColumns"
        [extraActions]="extraActions"
        [sorts]="sorts"
        [actionPermissions]="{ showEdit: false }"
        (sortChange)="onSortChange($event)"
        (action)="onTableAction($event)">
      </app-data-table>

      <mat-paginator
        [length]="attendanceTableData.meta.total"
        [pageSize]="filters.limit"
        [pageIndex]="filters.page - 1"
        [pageSizeOptions]="[5, 10, 25, 50]"
        (page)="onPageChange($event)"
        showFirstLastButtons>
      </mat-paginator>
    </div>
  }
</div>

<app-loading-overlay
  [visible]="loadingTable() || savingArrival()"
  [fullscreen]="true"
  [text]="savingArrival() ? 'Guardando llegada...' : 'Cargando llegadas y retardos...'">
</app-loading-overlay>
