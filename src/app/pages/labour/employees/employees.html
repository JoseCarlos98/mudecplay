<div class="card-content shadow-md">
  <app-module-header
    title="Empleados"
    [config]="headerConfig"
    (action)="onHeaderAction($event)">
  </app-module-header>

  <form [formGroup]="formFilters">
    <div class="c-filters grid grid-cols-2 sm:grid-cols-5 lg:grid-cols-6">
      <app-input-field
        formControlName="fullName"
        label="Nombre completo"
        type="text"
        [isFilter]="true">
      </app-input-field>

      <app-input-field
        formControlName="curp"
        label="CURP"
        type="text"
        [isFilter]="true">
      </app-input-field>

      <app-input-select
        formControlName="area"
        label="Área"
        [options]="areaOptions">
      </app-input-select>

      <app-input-select
        formControlName="employmentStatus"
        label="Estatus"
        [options]="statusOptions">
      </app-input-select>

      <app-btns-section
        type="search"
        [hasActiveFilters]="hasActiveFilters"
        (action)="onBtnsSectionAction($event)">
      </app-btns-section>
    </div>
  </form>
</div>

@if (employeesTableData.data.length > 0) {
  <div class="c-module-table">
    <app-data-table
      [data]="employeesTableData.data"
      [columnsConfig]="columnsConfig"
      [displayedColumns]="displayedColumns"
      [actionPermissions]="{
        editRoles: ['MANO_OBRA_EMPLEADOS_EDITOR']
      }"
      (action)="onTableAction($event)">
    </app-data-table>

    <mat-paginator
      [length]="employeesTableData.meta.total"
      [pageSize]="filters.limit"
      [pageIndex]="filters.page - 1"
      [pageSizeOptions]="[5, 10, 25, 50]"
      (page)="onPageChange($event)"
      showFirstLastButtons>
    </mat-paginator>
  </div>
}

<app-loading-overlay
  [visible]="loadingTable()"
  [fullscreen]="true"
  text="Cargando empleados...">
</app-loading-overlay>
