<div class="c-loading-host">
  <div class="card-content shadow-md">
    <input
      #xmlInput
      type="file"
      accept=".xml"
      multiple
      hidden
      (change)="onXmlSelected($event)"
    />

    <app-module-header
      title="Gastos"
      [config]="headerConfig"
      (action)="onHeaderAction($event)">
    </app-module-header>

    <form [formGroup]="formFilters">
      <div class="c-filters grid grid-cols-2 sm:grid-cols-5 lg:grid-cols-6">
        <app-input-date
          formControlName="dateRange"
          label="Rango de fecha"
          mode="range">
        </app-input-date>

        <app-autocomplete-multiple
          formControlName="suppliersIds"
          label="Proveedores"
          [remote]="true"
          catalogType="supplier"
          valueMode="objects">
        </app-autocomplete-multiple>

        <app-autocomplete-multiple
          formControlName="projectIds"
          label="Proyectos"
          [remote]="true"
          catalogType="project"
          valueMode="objects">
        </app-autocomplete-multiple>

        <app-input-select
          formControlName="status_id"
          label="Estado de asignación"
          [options]="catalogStatusExpense">
        </app-input-select>

        <app-input-select
          formControlName="paymentStatus"
          label="Estado de pago"
          [options]="paymentStatusOptions">
        </app-input-select>

        <app-btns-section
          type="search"
          [hasActiveFilters]="hasActiveFilters"
          (action)="onBtnsSectionAction($event)">
        </app-btns-section>
      </div>
    </form>
  </div>

  <div class="c-table-loading-host">
    @if (expensesTableData?.data) {
      <div class="c-module-table">
        <app-data-table
          [data]="expensesTableData.data"
          [columnsConfig]="columnsConfig"
          [displayedColumns]="displayedColumns"
          [extraActions]="extraActions"
          [canDelete]="canDeleteRow"
          [deleteTooltip]="deleteTooltip"
          [actionPermissions]="{
            editRoles: ['GASTOS_EDITOR']
          }"
          (action)="onTableAction($event)">
        </app-data-table>

        <mat-paginator
          [length]="expensesTableData.meta.total"
          [pageSize]="filters.limit"
          [pageIndex]="filters.page - 1"
          [pageSizeOptions]="[5, 10, 25, 50]"
          (page)="onPageChange($event)"
          showFirstLastButtons>
        </mat-paginator>
      </div>
    }

    <app-loading-overlay
      [visible]="loadingTable()"
      [fullscreen]="true"
      text="Cargando gastos...">
    </app-loading-overlay>
  </div>

  <app-loading-overlay
    [visible]="downloadingReceipt()"
    [fullscreen]="true"
    text="Descargando PDF...">
  </app-loading-overlay>
</div>
