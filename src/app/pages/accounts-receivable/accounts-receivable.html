<div class="c-table-page">
  <div class="card-content shadow-md">
    <input
      #xmlInput
      type="file"
      accept=".xml"
      multiple
      hidden
      (change)="onXmlSelected($event)"
    />

    <app-module-header
      title="Cuentas por cobrar"
      [config]="headerConfig"
      (action)="onHeaderAction($event)">
    </app-module-header>

    <form [formGroup]="formFilters">
      <div class="c-filters grid grid-cols-2 sm:grid-cols-5 lg:grid-cols-6">
        <app-input-date
          formControlName="dateRange"
          label="Fecha de emisión"
          mode="range">
        </app-input-date>

        <app-input-field
          formControlName="folio"
          label="Folio"
          type="text"|
          [isFilter]="true">
        </app-input-field>

        <app-input-select
          formControlName="companyCode"
          label="Empresa"
          [options]="companyOptions">
        </app-input-select>

        <app-input-field
          formControlName="clientQuery"
          label="Cliente / RFC"
          type="text"
          [isFilter]="true">
        </app-input-field>

        <app-input-select
          formControlName="status"
          label="Estado de cobro"
          [options]="statusOptions">
        </app-input-select>

        <app-btns-section
          type="search"
          [hasActiveFilters]="hasActiveFilters"
          (action)="onBtnsSectionAction($event)">
        </app-btns-section>
      </div>
    </form>
  </div>

  @if (accountsReceivableTableData?.data) {
    <div class="c-module-table">
      <app-data-table
        [data]="accountsReceivableTableData.data"
        [columnsConfig]="columnsConfig"
        [displayedColumns]="displayedColumns"
        [extraActions]="extraActions"
        [actionPermissions]="{
          editRoles: ['CUENTAS_POR_COBRAR_EDITOR']
        }"
        (action)="onTableAction($event)">
      </app-data-table>

      <mat-paginator
        [length]="accountsReceivableTableData.meta.total"
        [pageSize]="filters.limit"
        [pageIndex]="filters.page - 1"
        [pageSizeOptions]="[5, 10, 25, 50]"
        (page)="onPageChange($event)"
        showFirstLastButtons>
      </mat-paginator>
    </div>
  }
</div>

<app-loading-overlay
  [visible]="loadingTable()"
  [fullscreen]="true"
  text="Cargando cuentas por cobrar...">
</app-loading-overlay>
