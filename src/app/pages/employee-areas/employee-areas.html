<div class="card-content shadow-md">
  <app-module-header
    title="Áreas de empleado"
    [config]="headerConfig"
    (action)="onHeaderAction($event)">
  </app-module-header>

  <form [formGroup]="formFilters">
    <div class="c-filters grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6">
      <app-input-field
        formControlName="name"
        label="Nombre"
        type="text"
        [isFilter]="true">
      </app-input-field>

      <app-btns-section
        type="search"
        [hasActiveFilters]="hasActiveFilters"
        (action)="onBtnsSectionAction($event)">
      </app-btns-section>
    </div>
  </form>
</div>

@if (employeeAreasTableData?.data) {
  <div class="c-module-table">
    <app-data-table
      [data]="employeeAreasTableData.data"
      [columnsConfig]="columnsConfig"
      [displayedColumns]="displayedColumns"
      (action)="onTableAction($event)">
    </app-data-table>

    <mat-paginator
      [length]="employeeAreasTableData.meta.total"
      [pageSize]="filters.limit"
      [pageIndex]="filters.page - 1"
      [pageSizeOptions]="[5, 10, 25, 50]"
      (page)="onPageChange($event)"
      showFirstLastButtons>
    </mat-paginator>
  </div>
}
