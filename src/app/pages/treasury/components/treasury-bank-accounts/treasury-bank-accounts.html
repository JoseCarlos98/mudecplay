<div class="c-table-page">
  <div class="card-content shadow-md">
    <app-module-header
      title="Cuentas bancarias"
      [config]="headerConfig"
      (action)="onHeaderAction($event)">
    </app-module-header>

    <form [formGroup]="formFilters">
      <div class="c-filters grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-5">
        <app-input-field
          formControlName="search"
          label="Alias o cuenta"
          type="text"
          [isFilter]="true">
        </app-input-field>

        <app-input-select
          formControlName="company_id"
          label="Empresa"
          [options]="companyOptions">
        </app-input-select>

        <app-input-select
          formControlName="bank_id"
          label="Banco"
          [options]="bankOptions">
        </app-input-select>

        <app-input-select
          formControlName="is_active"
          label="Estatus"
          [options]="activeStatusOptions">
        </app-input-select>

        <app-btns-section
          type="search"
          [hasActiveFilters]="hasActiveFilters"
          (action)="onBtnsSectionAction($event)">
        </app-btns-section>
      </div>
    </form>
  </div>

  <div class="c-module-table">
    <app-data-table
      [data]="treasuryBankAccountsTableData"
      [columnsConfig]="columnsConfig"
      [displayedColumns]="displayedColumns"
      [extraActions]="extraActions"
      [actionPermissions]="{
        showEdit: false,
        showDelete: false
      }"
      (action)="onTableAction($event)">
    </app-data-table>
  </div>
</div>

<app-loading-overlay
  [visible]="loadingTable()"
  [fullscreen]="true"
  text="Cargando cuentas bancarias...">
</app-loading-overlay>
