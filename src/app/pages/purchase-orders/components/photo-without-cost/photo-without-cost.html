<div class="c-table-page">
  <div class="card-content shadow-md">
    <app-module-header
      title="Fotos sin gasto"
      [config]="headerConfig"
      (action)="onHeaderAction($event)">
    </app-module-header>

    <form [formGroup]="formFilters">
      <div class="c-filters grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-5">
        <app-autocomplete-multiple
          formControlName="project"
          label="Proyecto"
          placeholder="Buscar proyecto"
          [remote]="true"
          catalogType="project">
        </app-autocomplete-multiple>

        <app-btns-section
          class="filter-actions"
          type="search"
          [hasActiveFilters]="hasActiveFilters"
          (action)="onBtnsSectionAction($event)">
        </app-btns-section>
      </div>
    </form>
  </div>

  <div class="c-module-table">
    <app-data-table
      [data]="photos"
      [columnsConfig]="columnsConfig"
      [displayedColumns]="displayedColumns"
      [extraActions]="extraActions"
      [actionPermissions]="{
        showEdit: false,
        showDelete: false
      }"
      (action)="onTableAction($event)">
    </app-data-table>

    @if (totalPhotos > 0) {
      <mat-paginator
        [length]="totalPhotos"
        [pageSize]="filters.limit"
        [pageIndex]="filters.page - 1"
        [pageSizeOptions]="pageSizeOptions"
        (page)="onPageChange($event)"
        showFirstLastButtons>
      </mat-paginator>
    }
  </div>
</div>

<app-loading-overlay
  [visible]="loadingTable()"
  [fullscreen]="true"
  text="Cargando fotos pendientes...">
</app-loading-overlay>
