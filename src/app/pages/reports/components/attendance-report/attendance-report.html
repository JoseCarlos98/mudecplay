<section class="report-tab">

  <!-- =====================================================
       ENCABEZADO
       ===================================================== -->

  <header class="report-tab__header">

    <h2 class="report-tab__title">
      Asistencia de Mano de Obra
    </h2>

    <p class="report-tab__desc">
      Consulta los días trabajados, las faltas y las
      vacaciones de todos los trabajadores dentro del
      rango de fechas seleccionado.
    </p>

  </header>



  <!-- =====================================================
     FILTROS
     ===================================================== -->

  <form [formGroup]="formFilters">

    <div class="c-filters grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-4">

      <!-- RANGO DE FECHAS -->

      <div class="col-span-2 md:col-span-2">

        <app-input-date formControlName="dateRange" label="Rango de fechas" mode="range">
        </app-input-date>

      </div>


      <!-- BOTÓN CONSULTAR -->

      <div class="col-span-2 sm:col-span-1">

        <app-btns-section type="search" [hasActiveSearch]="hasActiveSearch" [hasActiveFilters]="false"
          (action)="onBtnsSectionAction($event)">
        </app-btns-section>

      </div>


      <!-- BOTÓN DESCARGAR PDF -->

      <div class="col-span-2 sm:col-span-1 flex items-center justify-end">

        <button type="button" class="btn-primary" [disabled]="!hasActiveSearch || loadingPreview()"
          (click)="downloadPdf()">

          <mat-icon>download</mat-icon>

          <span>Descargar PDF</span>

        </button>

      </div>

    </div>

  </form>



  <!-- =====================================================
       VISTA PREVIA PDF
       ===================================================== -->

  @if (pdfUrl() || loadingPreview()) {

  <div class="c-pdf-wrap">

    @if (pdfUrl()) {

    <iframe class="c-pdf-viewer" title="Reporte de asistencia de mano de obra" [src]="pdfUrl()">
    </iframe>

    } @else {

    <div class="c-pdf-placeholder">
    </div>

    }


    <app-loading-overlay [visible]="loadingPreview()" text="Generando reporte de asistencia...">
    </app-loading-overlay>

  </div>

  }


  <!-- =====================================================
       ERRORES
       ===================================================== -->

  @if (errorPreview()) {

  <div class="c-preview-error" role="alert">

    {{ errorPreview() }}

  </div>

  }

</section>
