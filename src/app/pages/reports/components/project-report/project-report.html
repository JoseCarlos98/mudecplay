<section class="report-tab">
  <header class="report-tab__header">
    <h2 class="report-tab__title">Detalle de gastos por proyecto</h2>
    <p class="report-tab__desc">
      Selecciona filtros y genera el preview del PDF.
    </p>
  </header>

  <!-- Filtros -->
  <form [formGroup]="formFilters">
    <div class="c-filters grid grid-cols-2 sm:grid-cols-5 lg:grid-cols-6">
      <app-input-date
        formControlName="dateRange"
        label="Rango de fecha"
        mode="range">
      </app-input-date>

      <app-autocomplete 
        formControlName="projectId"
        label="Proyectos"
        [remote]="true"
        catalogType="project">
      </app-autocomplete>

      <app-autocomplete-multiple
        formControlName="suppliersIds"
        label="Proveedores"
        [remote]="true"
        catalogType="supplier"
        valueMode="objects">
      </app-autocomplete-multiple>

      <app-btns-section
        type="search"
        [hasActiveFilters]="hasActiveFilters"
        (action)="onBtnsSectionAction($event)">
      </app-btns-section>
    </div>
  </form>

  @if (pdfUrl()) {
  <div style="margin-top: 16px; height: 720px; border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden;">
    <iframe [src]="pdfUrl()" style="width: 100%; height: 100%; border: 0;"></iframe>
  </div>
}

    <div class="report-preview-box__body">
      Aquí irá el preview del PDF.
      
    </div>
  </div> -->
</section>
