<app-page-tabs

  [title]="'Reportes'"

  [description]="
    'Consulta y genera los reportes financieros de los proyectos.'
  "

  [tabs]="tabs"

  [activeTab]="activeSection()"

  (activeTabChange)="
    onActiveTabChange($event)
  ">


  <div
    [hidden]="
      activeSection() !==
      'project_all'
    ">

    <app-project-all-report>
    </app-project-all-report>

  </div>


  <div
    [hidden]="
      activeSection() !==
      'project_classification'
    ">

    <app-project-classification-report>
    </app-project-classification-report>

  </div>

</app-page-tabs>
