<app-page-tabs [title]="'Reportes'" [description]="
    'Consulta y genera reportes financieros y de asistencia de mano de obra.'
  " [tabs]="tabs" [activeTab]="activeSection()" (activeTabChange)="onActiveTabChange($event)">

  <!-- =====================================================
       REPORTE FINANCIERO DEL PROYECTO
       ===================================================== -->

  <div [hidden]="
      activeSection() !==
      'project_all'
    ">

    <app-project-all-report>
    </app-project-all-report>

  </div>

  <!-- =====================================================
       CLASIFICACIÓN DE GASTOS
       ===================================================== -->

  <div [hidden]="
      activeSection() !==
      'project_classification'
    ">

    <app-project-classification-report>
    </app-project-classification-report>

  </div>

  <!-- =====================================================
       ANÁLISIS DE GASTOS
       ===================================================== -->

  @if (expenseAnalysisInitialized()) {
  <div [hidden]="
        activeSection() !==
        'expense_analysis'
      ">

    <app-expense-analysis>
    </app-expense-analysis>

  </div>
  }

  <!-- =====================================================
       ASISTENCIA DE MANO DE OBRA
       ===================================================== -->
  <div [hidden]="
      activeSection() !==
      'attendance'
    ">

    <app-attendance-report>
    </app-attendance-report>
  </div>

</app-page-tabs>
