<app-page-tabs
  [title]="'Reportes'"
  [description]="'Genera reportes en PDF a partir de filtros: proyecto, proveedor, área y rango de fechas.'"
  [tabs]="tabs"
  [activeTab]="activeSection()"
  (activeTabChange)="onActiveTabChange($event)"
>
  @switch (activeSection()) { 
    @case ('project_detail') {
      <app-project-report></app-project-report>
    }
    @case ('project_by_supplier') {
        <app-supplier-report></app-supplier-report>
    }
    @case ('by_area') {
      <app-area-report></app-area-report>
    }
    @case ('project_payables') {
      <p style="margin:0; color:#6b7280;">(Pendiente) Resumen del proyecto (lo gastado y lo que debo)</p>
    }
  }
</app-page-tabs>
